<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="18" viewBox="0 0 1200 18">
<defs>
  <linearGradient id="flow" x1="0%" y1="0%" x2="200%" y2="0%">
    <stop offset="0%" stop-color="#050505"/>
    <stop offset="20%" stop-color="#050505"/>
    <stop offset="35%" stop-color="#ff003c"/>
    <stop offset="45%" stop-color="#050505"/>
    <stop offset="65%" stop-color="#050505"/>
    <stop offset="80%" stop-color="#ff003c"/>
    <stop offset="90%" stop-color="#050505"/>
    <stop offset="100%" stop-color="#050505"/>
    <animate attributeName="x1" from="0%" to="100%" dur="1.35s" repeatCount="indefinite"/>
    <animate attributeName="x2" from="200%" to="300%" dur="1.35s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="glow" x="-10%" y="-200%" width="120%" height="500%">
    <feGaussianBlur stdDeviation="1.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x="0" y="6" width="1200" height="6" rx="3" fill="#030303"/>
<rect x="0" y="6" width="1200" height="6" rx="3" fill="url(#flow)" filter="url(#glow)"/>
<rect x="0" y="8" width="1200" height="2" fill="#0a0002" opacity=".85"/>
</svg>